<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الفئة - نوح</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a1a; color: #e0e0e0; padding: 20px; }
        .header { background: linear-gradient(135deg, #1a1a3e, #0a0a1a); padding: 20px; text-align: center; border-radius: 15px; border: 1px solid #4a4aff; margin-bottom: 20px; }
        .header h1 { font-size: 1.8em; color: #ffd700; }
        .header p { color: #aaa; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
        .item { background: #151530; border: 1px solid #2a2a5e; border-radius: 8px; padding: 10px; text-align: center; font-size: 0.85em; word-break: break-word; }
        a { color: #4a4aff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 {{ attr }}</h1>
        <p>عدد العناصر: {{ count }}</p>
        <p><a href="/browse">↩ العودة للاستعراض</a></p>
    </div>
    <div class="grid">
        {% for item in items %}
        <div class="item">{{ item }}</div>
        {% endfor %}
    </div>
</body>
</html>
